name: Publish and record 16 AnimStudio clips
on:
  push:
    branches: ['next/babylon-game-foundation-20261115']
    paths:
      - '.github/workflows/publish-animstudio-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch original AnimStudio animation exports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/anim-exports babylon/animstudio-preview/models
          gh run download 43714882285 --repo jango763/battlefield --name animstudio-four-weapons --dir /tmp/anim-exports
          ls -lah /tmp/anim-exports
          cp /tmp/anim-exports/Battlefield_Panzerschreck.glb babylon/animstudio-preview/models/all-animations.glb
          cp /tmp/anim-exports/de-panzerschreck-preview.glb babylon/animstudio-preview/models/de-panzerschreck-preview.glb
          test -s babylon/animstudio-preview/models/all-animations.glb
      - name: Verify viewer on desktop and phone
        shell: bash
        run: |
          node --check babylon/animstudio-preview/viewer.js
          node --check babylon/animstudio-preview/test-viewer.cjs
          node --check babylon/animstudio-preview/record-video.cjs
          npm install --no-audit --no-fund --prefix /tmp/animstudio-viewer-qa playwright@1.58.2
          /tmp/animstudio-viewer-qa/node_modules/.bin/playwright install chromium
          python3 -m http.server 8758 --bind 127.0.0.1 > /tmp/animstudio-viewer-http.log 2>&1 &
          sleep 2
          node babylon/animstudio-preview/test-viewer.cjs
      - name: Record all 16 animations as MP4
        run: node babylon/animstudio-preview/record-video.cjs
      - name: Save video and screenshot QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battlefield-all-16-animation-video
          path: babylon/animstudio-preview/qa/
          if-no-files-found: ignore
          retention-days: 30
      - name: Publish GLB exports only to Babylon branch
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add babylon/animstudio-preview/models/
          git commit -m 'assets(babylon): publish approved soldier and all 16 AnimStudio clips for review'
          git push origin HEAD:next/babylon-game-foundation-20261115

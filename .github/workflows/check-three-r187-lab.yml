name: Standalone Three.js r187 GLB and rig lab
on:
  push:
    branches: [lab/three-r187-rig-poc-20261114]
    paths:
      - 'lab/three-r187/**'
      - '.github/workflows/check-three-r187-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r187-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Check module and browser test syntax
        run: |
          node --check --input-type=module < lab/three-r187/app.js
          node --check lab/three-r187/test-r187-lab.cjs
      - name: Install Playwright and Chromium
        run: |
          npm install --no-audit --no-fund --prefix /tmp/r187-lab-qa playwright@1.58.2
          /tmp/r187-lab-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Run isolated Three.js r187 with real rigs on desktop and mobile
        run: |
          python3 -m http.server 8777 --bind 127.0.0.1 >/tmp/r187-lab-server.log 2>&1 &
          sleep 2
          node lab/three-r187/test-r187-lab.cjs
      - name: Store real render screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r187-lab-real-GLB-screenshots
          path: /tmp/r187-lab-*.png
          if-no-files-found: warn

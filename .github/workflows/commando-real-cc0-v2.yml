name: Genuine British Commando WWII CC0 3D v2
on:
  push:
    branches: [feature/british-army-10-stages-20261118]
    paths:
      - '.github/workflows/commando-real-cc0-v2.yml'
      - 'tools/jakeli/build-commando-cc0-v2.py'
      - 'tools/jakeli/test-commando-cc0-v2.py'
      - 'babylon/commando-real-v2-iphone.html'
      - 'babylon/commando-real-v2-main.js'
      - 'babylon/tests/test-commando-cc0-v2-browser.cjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: commando-real-cc0-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-real-commando:
    if: github.ref == 'refs/heads/feature/british-army-10-stages-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public-domain rigged World War II model
        run: |
          set -euo pipefail
          mkdir -p babylon-qa-results/commando-ww2-source/files
          curl -fL --retry 3 --silent --show-error \
            'https://opengameart.org/sites/default/files/lowpolysoldier.zip' \
            -o babylon-qa-results/commando-ww2-source/lowpolysoldier.zip
          unzip -q -o babylon-qa-results/commando-ww2-source/lowpolysoldier.zip \
            -d babylon-qa-results/commando-ww2-source/files
          test -s babylon-qa-results/commando-ww2-source/files/LowpolySoldier/LowpolySoldier.fbx
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/jakeli/requirements-blender.txt
      - name: Install pinned Blender 4.3 for repeatable retarget
        run: |
          python -m pip install --only-binary=:all: -r tools/jakeli/requirements-blender.txt
      - name: Bind authentic original WWII mesh to 65-bone Quaternius controller
        env:
          COMMANDO_RENDER: '1'
        run: python tools/jakeli/build-commando-cc0-v2.py
      - name: Reject dummy body and invalid motion or skin
        run: python tools/jakeli/test-commando-cc0-v2.py
      - name: Install mobile Chromium and WebKit
        run: |
          npm install --no-audit --no-fund --prefix /tmp/commando-cc0-qa playwright@1.58.2
          /tmp/commando-cc0-qa/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Verify real Commando 3D model and six poses in mobile browsers
        run: |
          python -m http.server 8844 --bind 127.0.0.1 >/tmp/commando-real-v2-http.log 2>&1 &
          sleep 2
          node babylon/tests/test-commando-cc0-v2-browser.cjs
      - name: Save visual proof and rig export for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: british-commando-real-ww2-cc0-v2-evidence
          path: |
            assets/allied-soldiers/uk-commando-cc0-sten-v2.glb
            babylon-qa-results/commando-cc0-v2/
            babylon-qa-results/commando-cc0-v2-browser/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish verified nonapproved Commando v2 only in feature branch
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = 'refs/heads/feature/british-army-10-stages-20261118'
          branch=feature/british-army-10-stages-20261118
          model=assets/allied-soldiers/uk-commando-cc0-sten-v2.glb
          cp "$model" /tmp/commando-v2-verified.glb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$branch"
          # Outdated runs must never overwrite the newest animation script or viewer.
          if ! git show "origin/$branch:tools/jakeli/build-commando-cc0-v2.py" | cmp -s - tools/jakeli/build-commando-cc0-v2.py; then
            echo 'Skipping superseded Commando build: Blender script changed'
            exit 0
          fi
          if ! git show "origin/$branch:babylon/commando-real-v2-main.js" | cmp -s - babylon/commando-real-v2-main.js; then
            echo 'Skipping superseded Commando build: viewer changed'
            exit 0
          fi
          for attempt in 1 2 3; do
            git fetch origin "$branch"
            git checkout -B ci-commando-publish "origin/$branch"
            cp /tmp/commando-v2-verified.glb "$model"
            git add "$model"
            if git diff --cached --quiet; then
              echo 'Verified GLB already published'
              exit 0
            fi
            git commit -m 'Publish unapproved genuine WW2 Commando v2 for Safari preview [skip ci]'
            if git push origin HEAD:refs/heads/feature/british-army-10-stages-20261118; then
              echo 'Verified Commando preview published successfully'
              exit 0
            fi
            echo "Concurrent update detected; refreshing binary base ($attempt/3)"
            sleep 2
          done
          echo 'Could not publish due to concurrent branch updates'
          exit 1

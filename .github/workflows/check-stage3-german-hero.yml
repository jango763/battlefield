name: Stage 3 German hero silhouette QA
on:
  push:
    branches: [feature/roadmap-15-stages-20261114]
    paths:
      - 'preview/german-v5.js'
      - 'preview/formation-replenishment-v3.html'
      - 'tools/infantry-v2/test-stage3-german-hero.cjs'
      - '.github/workflows/check-stage3-german-hero.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hero-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript and role isolation
        run: |
          node tools/infantry-v2/test-stage2-startup.cjs
          node tools/infantry-v2/test-stage3-german-hero.cjs
          node tools/infantry-v2/test-wehrmacht-rollout.cjs
      - name: Prepare Chromium browser QA
        run: |
          npm install --no-audit --no-fund --prefix /tmp/stage3-qa playwright@1.58.2
          /tmp/stage3-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Compare German hero and regular soldier in desktop/mobile
        run: |
          python3 -m http.server 8777 --bind 127.0.0.1 >/tmp/stage3-http.log 2>&1 &
          sleep 2
          node tools/infantry-v2/test-stage3-german-hero.cjs --browser
      - name: Save hero inspection screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-german-hero-screenshots
          path: /tmp/stage3-hero-*.png
          if-no-files-found: warn

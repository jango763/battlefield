name: US hero Lee-Enfield right hand visibility v9 QA
on:
  push:
    branches:
      - fix/us-hero-right-hand-visible-v9-20261117
    paths:
      - 'babylon/us-hero-ara-lee-enfield-stage4.js'
      - 'babylon/us-hero-right-hand-v9-iphone.html'
      - 'babylon/tests/test-us-hero-right-hand-v9-browser.cjs'
      - '.github/workflows/us-hero-right-hand-v9-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Static validation
        run: node babylon/tests/test-us-hero-stage4-static.cjs
      - name: Install Chromium
        run: |
          npm install --no-audit --no-fund --prefix /tmp/stage4-qa playwright@1.58.2
          /tmp/stage4-qa/node_modules/.bin/playwright install chromium
      - name: Render right hand in 3 controlled poses
        run: |
          python3 -m http.server 8758 --bind 127.0.0.1 >/tmp/stage4-http.log 2>&1 &
          sleep 2
          node babylon/tests/test-us-hero-right-hand-v9-browser.cjs
      - name: Upload visual comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-hero-right-hand-v9-screenshots
          path: babylon-qa-results/right-hand-v9/
          if-no-files-found: ignore

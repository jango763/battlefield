name: Research rig anatomy — visual glove surface versus bone IK
on:
  push:
    branches: [research/rig-anatomy-20261114]
    paths:
      - 'tools/rig-research/**'
      - '.github/workflows/check-rig-anatomy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium for non-invasive geometry diagnostics
        run: |
          npm install --no-audit --no-fund --prefix /tmp/rig-anatomy-qa playwright@1.58.2
          /tmp/rig-anatomy-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Compare source and costume hands in idle aim and locomotion
        run: |
          python3 -m http.server 8777 --bind 127.0.0.1 >/tmp/rig-anatomy-http.log 2>&1 &
          sleep 2
          node tools/rig-research/diagnose-native-donor.cjs | tee /tmp/rig-anatomy-results.log
      - name: Archive screenshots and numerical report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-rig-anatomy
          path: |
            /tmp/rig-anatomy-results.log
            /tmp/rig-research-*.png
          if-no-files-found: warn

name: American hero four weapons QA
on:
  push:
    branches:
      - feature/us-hero-combat-ready-four-weapons-20261117
    paths:
      - 'babylon/us-combat*'
      - 'babylon/tests/test-us-combat-iphone.cjs'
      - 'assets/allied-soldiers/american-hero-base64/**'
      - '.github/workflows/us-hero-combat-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phone-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install headless browser
        run: |
          npm install --no-audit --no-fund --prefix /tmp/babylon-qa playwright@1.58.2
          /tmp/babylon-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser render and IK capture
        run: |
          python3 -m http.server 8758 --bind 127.0.0.1 > /tmp/us-hero-http.log 2>&1 &
          sleep 2
          node babylon/tests/test-us-combat-iphone.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: us-hero-aim-four-weapons
          path: babylon-qa-results/us-hero/
          if-no-files-found: ignore

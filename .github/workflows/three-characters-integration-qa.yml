name: Three original Battlefield characters - Babylon integration QA
on:
  push:
    branches:
      - 'feature/unified-three-characters-*'
    paths:
      - 'babylon/**'
      - 'assets/allied-soldiers/**'
      - 'assets/soldiers/**'
      - '.github/workflows/three-characters-integration-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  three-original-models:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Confirm exact GLBs and prevent swapped outfits or skeletons
        run: |
          node --check babylon/character-sources.js
          node --check babylon/game.js
          node --check babylon/allied-asset-loader.js
          node --check babylon/tests/test-character-integration.cjs
          node babylon/tests/test-character-integration.cjs
          node babylon/tests/test-game-entry.cjs
          node babylon/tests/test-allied-loader.cjs
      - name: Install Chromium and WebKit for iPhone-sized integration checks
        run: |
          npm install --no-audit --no-fund --prefix /tmp/battlefield-actual-allies playwright@1.58.2
          /tmp/battlefield-actual-allies/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Render unified scene: US hero, Jakeli British infantry and German opponents
        run: |
          python3 -m http.server 8855 --bind 127.0.0.1 >/tmp/battlefield-integrated-http.log 2>&1 &
          sleep 2
          node babylon/tests/test-real-allied-squad-integration.cjs
      - name: Upload 390x844 screenshots and detailed status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: three-original-character-integration-mobile
          path: babylon-qa-results/actual-three-soldier-integrated/
          if-no-files-found: ignore

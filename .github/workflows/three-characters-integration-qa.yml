name: Unified three characters QA
on:
  push:
    branches:
      - 'feature/unified-three-characters-*'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify three GLB sources and game entry
        run: |
          node --check babylon/character-sources.js
          node --check babylon/game.js
          node babylon/tests/test-character-integration.cjs
          node babylon/tests/test-game-entry.cjs
          node babylon/tests/test-allied-loader.cjs

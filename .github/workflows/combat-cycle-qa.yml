name: Babylon stop-to-fire combat-cycle tests
on:
  push:
    branches: ['next/babylon-game-foundation-20261115']
    paths:
      - 'babylon/animstudio-preview/combat-cycle-core.js'
      - 'babylon/animstudio-preview/test-combat-cycle.cjs'
      - '.github/workflows/combat-cycle-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate deterministic fire, aim and bolt markers at 30/60/144 FPS
        run: |
          node --check babylon/animstudio-preview/combat-cycle-core.js
          node babylon/animstudio-preview/test-combat-cycle.cjs

name: British army 10 stages - source and combat QA
on:
  push:
    branches:
      - 'feature/british-army-10-stages-*'
    paths:
      - 'babylon/british-army-pipeline.js'
      - 'babylon/british-stage2-rig-audit.js'
      - 'babylon/british-stage2-iphone.html'
      - 'babylon/british-stage3-motion.js'
      - 'babylon/british-stage3-iphone.html'
      - 'babylon/british-stage4-stance.js'
      - 'babylon/british-stage4-iphone.html'
      - 'babylon/tests/test-british-army-stage4*.cjs'
      - 'babylon/british-stage5-lee-enfield.js'
      - 'babylon/british-stage5-iphone.html'
      - 'babylon/tests/test-british-army-stage5*.cjs'
      - 'babylon/british-stage6-sten.js'
      - 'babylon/british-stage6-iphone.html'
      - 'babylon/tests/test-british-army-stage6*.cjs'
      - 'babylon/british-stage7-bren.js'
      - 'babylon/british-stage7-iphone.html'
      - 'babylon/tests/test-british-army-stage7*.cjs'
      - 'babylon/tests/test-british-army-stage3*.cjs'
      - 'babylon/tests/test-british-army-stage1.cjs'
      - 'babylon/tests/test-british-army-stage2*.cjs'
      - 'babylon/BRITISH_ARMY_10_STAGES.md'
      - 'assets/allied-soldiers/manifest.json'
      - '.github/workflows/british-army-10-stages-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  british-army-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate British army identities and both headwear roles
        run: |
          node --check babylon/british-army-pipeline.js
          node --check babylon/tests/test-british-army-stage1.cjs
          node babylon/tests/test-british-army-stage1.cjs
      - name: Test stage2 65-bone, skin weights and original source gate
        run: |
          node --check babylon/british-stage2-rig-audit.js
          node --check babylon/tests/test-british-army-stage2.cjs
          node babylon/tests/test-british-army-stage2.cjs
      - name: Validate four Quaternius locomotion clips and target mappings
        run: |
          node --check babylon/british-stage3-motion.js
          node --check babylon/tests/test-british-army-stage3.cjs
          node babylon/tests/test-british-army-stage3.cjs
      - name: Validate original Weapon_R grip and full-body target facing
        run: |
          node --check babylon/british-stage4-stance.js
          node --check babylon/tests/test-british-army-stage4.cjs
          node babylon/tests/test-british-army-stage4.cjs
      - name: Validate Lee-Enfield real damage, infinite ammo and 2.1s shot interval
        run: |
          node --check babylon/british-stage5-lee-enfield.js
          node --check babylon/tests/test-british-army-stage5.cjs
          node babylon/tests/test-british-army-stage5.cjs
      - name: Verify Sten 160 rounds, reload and rifle fallback from original BattlefieldBalance
        run: |
          node --check babylon/british-stage6-sten.js
          node --check babylon/tests/test-british-army-stage6.cjs
          node babylon/tests/test-british-army-stage6.cjs
      - name: Verify Bren 400 rounds, 7.5s reload, moving fire and rifle fallback
        run: |
          node --check babylon/british-stage7-bren.js
          node --check babylon/tests/test-british-army-stage7.cjs
          node babylon/tests/test-british-army-stage7.cjs
      - name: Guard approved hero damage and ammo
        run: |
          node babylon/tests/test-us-hero-stage9-bridge.cjs
      - name: Install mobile Chromium
        run: |
          npm install --no-audit --no-fund --prefix /tmp/british-stage2-qa playwright@1.58.2
          /tmp/british-stage2-qa/node_modules/.bin/playwright install chromium
      - name: Verify iPhone-sized original-GLB inspector against real hero control rig
        run: |
          node --check babylon/tests/test-british-army-stage2-browser.cjs
          python3 -m http.server 8799 --bind 127.0.0.1 >/tmp/british-stage2-http.log 2>&1 &
          sleep 2
          node babylon/tests/test-british-army-stage2-browser.cjs
      - name: Verify source-to-target retargeting and four motions on mobile
        run: |
          node --check babylon/tests/test-british-army-stage3-browser.cjs
          node babylon/tests/test-british-army-stage3-browser.cjs
      - name: Verify iPhone-sized two-hand IK, rifle aim and anti-backwards-shooting
        run: |
          node --check babylon/tests/test-british-army-stage4-browser.cjs
          node babylon/tests/test-british-army-stage4-browser.cjs
      - name: Verify stage5 iPhone Lee-Enfield rifle firing and authentic BattlefieldBalance
        run: |
          node --check babylon/tests/test-british-army-stage5-browser.cjs
          node babylon/tests/test-british-army-stage5-browser.cjs
      - name: Verify iPhone Sten two-handed IK, live moving fire and 2.5s reload
        run: |
          node --check babylon/tests/test-british-army-stage6-browser.cjs
          node babylon/tests/test-british-army-stage6-browser.cjs
      - name: Verify iPhone Bren two-hand IK, target hits and 7.5s reload
        run: |
          node --check babylon/tests/test-british-army-stage7-browser.cjs
          node babylon/tests/test-british-army-stage7-browser.cjs
      - name: Upload mobile stage2-stage7 inspection screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: british-stage2-stage3-mobile-skeleton-motion
          path: |
            babylon-qa-results/british-stage2/
            babylon-qa-results/british-stage3/
            babylon-qa-results/british-stage4/
            babylon-qa-results/british-stage5/
            babylon-qa-results/british-stage6/
            babylon-qa-results/british-stage7/
          if-no-files-found: ignore

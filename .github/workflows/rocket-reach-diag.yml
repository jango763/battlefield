name: Rocket arm reach diagnostic
on:
  push:
    branches: ['next/babylon-game-foundation-20261115']
    paths:
      - 'babylon/animstudio-preview/test-rocket-reach.cjs'
      - '.github/workflows/rocket-reach-diag.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Prepare renderer
        run: |
          npm install --no-audit --no-fund --prefix /tmp/animstudio-viewer-qa playwright@1.58.2
          /tmp/animstudio-viewer-qa/node_modules/.bin/playwright install chromium
          python3 -m http.server 8758 --bind 127.0.0.1 >/tmp/rocket-server.log 2>&1 &
          sleep 2
      - name: Measure launcher IK arm reach
        run: node babylon/animstudio-preview/test-rocket-reach.cjs

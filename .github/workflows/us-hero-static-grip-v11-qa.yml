name: US hero v11 static grip mobile performance
on:
  push:
    branches:
      - feature/us-hero-weapon-surface-finger-ik-v10-20261117
    paths:
      - 'babylon/us-hero-ara-lee-enfield-stage4.js'
      - 'babylon/us-hero-lee-enfield-static-grip-v11-iphone.html'
      - 'babylon/tests/test-us-hero-static-grip-v11-browser.cjs'
      - '.github/workflows/us-hero-static-grip-v11-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Source regression for original hero and arm isolation
        run: node babylon/tests/test-us-hero-stage4-static.cjs
      - name: Install headless Chromium
        run: |
          npm install --no-audit --no-fund --prefix /tmp/stage4-qa playwright@1.58.2
          /tmp/stage4-qa/node_modules/.bin/playwright install chromium
      - name: Validate ready and aim static grip FPS and hand contacts
        run: |
          python3 -m http.server 8758 --bind 127.0.0.1 >/tmp/stage4-http.log 2>&1 &
          sleep 2
          node babylon/tests/test-us-hero-static-grip-v11-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: us-hero-static-grip-v11-mobile
          path: babylon-qa-results/static-grip-v11/
          if-no-files-found: ignore

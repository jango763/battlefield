name: US hero v10 real finger contact QA
on:
  push:
    branches:
      - feature/us-hero-weapon-surface-finger-ik-v10-20261117
    paths:
      - 'babylon/us-hero-ara-lee-enfield-stage4.js'
      - 'babylon/us-hero-lee-enfield-finger-contact-v10-iphone.html'
      - 'babylon/tests/test-us-hero-finger-contact-v10-browser.cjs'
      - '.github/workflows/us-hero-finger-contact-v10-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Verify no duplicate hand meshes
        run: node babylon/tests/test-us-hero-stage4-static.cjs
      - name: Install Chromium
        run: |
          npm install --no-audit --no-fund --prefix /tmp/stage4-qa playwright@1.58.2
          /tmp/stage4-qa/node_modules/.bin/playwright install chromium
      - name: A/B compare finger targets against actual weapon surface
        run: |
          python3 -m http.server 8758 --bind 127.0.0.1 >/tmp/stage4-http.log 2>&1 &
          sleep 2
          node babylon/tests/test-us-hero-finger-contact-v10-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: us-hero-finger-contact-v10-mobile
          path: babylon-qa-results/finger-contact-v10/
          if-no-files-found: ignore

name: Battlefield unit motion — skeletons and clips only
on:
  push:
    branches:
      - feature/unit-motion-unification-20261122
    paths:
      - 'babylon/unit-motion-unifier.js'
      - 'babylon/game.js'
      - 'babylon/index.html'
      - 'babylon/units-first.js'
      - 'babylon/units-first.html'
      - 'babylon/tests/test-unit-motion-unifier.cjs'
      - 'babylon/tests/test-units-first-assets.cjs'
      - '.github/workflows/unit-motion-unifier-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  soldier-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check only soldier JavaScript syntax
        run: |
          node --check babylon/unit-motion-unifier.js
          node --check babylon/units-first.js
          node --check babylon/game.js
      - name: Test independent skeletons, donor retarget and clip transitions
        run: |
          node babylon/tests/test-unit-motion-unifier.cjs
          node babylon/tests/test-native-blend.cjs
          node babylon/tests/test-units-first-assets.cjs

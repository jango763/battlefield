name: American hero Ara armed hybrid QA
on:
  push:
    branches:
      - feature/us-hero-ara-ready-production-20261117
    paths:
      - 'babylon/american-hero-ara-*'
      - 'babylon/tests/test-us-hero-ara-browser.cjs'
      - '.github/workflows/us-hero-ara-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iphone-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check babylon/american-hero-ara-socket-prototype.js
          node --check babylon/tests/test-us-hero-ara-browser.cjs
          test -s assets/allied-soldiers/us-hero-quaternius.glb
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-audit playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Render and capture iPhone-sized previews
        run: |
          python3 -m http.server 8758 --bind 127.0.0.1 >/tmp/us-hero-ara-http.log 2>&1 &
          sleep 3
          node babylon/tests/test-us-hero-ara-browser.cjs
      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-hero-ara-ready-screenshots
          path: us-hero-ara-qa-results/
          if-no-files-found: ignore

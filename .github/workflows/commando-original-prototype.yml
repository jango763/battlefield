name: Experimental original British Commando 65-bone prototype
on:
  push:
    branches:
      - feature/british-army-10-stages-20261118
    paths:
      - '.github/workflows/commando-original-prototype.yml'
      - 'tools/jakeli/build-commando-prototype.py'
      - 'tools/jakeli/test-commando-prototype.cjs'
      - 'babylon/commando-arsenal-main.js'
      - 'babylon/commando-arsenal-iphone.html'
      - 'babylon/tests/test-commando-arsenal-browser.cjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: commando-original-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-commando-prototype:
    if: github.ref == 'refs/heads/feature/british-army-10-stages-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/jakeli/requirements-blender.txt
      - name: Load pinned Blender runtime
        run: |
          python -m pip install --only-binary=:all: -r tools/jakeli/requirements-blender.txt
          python -c "import bpy; assert bpy.app.version == (4,3,0)"
      - name: Generate original independent Commando geometry and four weapons
        run: |
          set -euo pipefail
          for weapon in uk-lee-enfield uk-sten uk-bren uk-piat; do
            echo "COMMANDO_MODEL_BUILD $weapon"
            COMMANDO_WEAPON="$weapon" python tools/jakeli/build-commando-prototype.py
          done
      - name: Verify four actual 65-bone Commando GLBs and original separate sculpt
        run: |
          set -euo pipefail
          for weapon in uk-lee-enfield uk-sten uk-bren uk-piat; do
            COMMANDO_WEAPON="$weapon" node tools/jakeli/test-commando-prototype.cjs
          done
      - name: Install mobile Chromium and WebKit
        run: |
          npm install --no-audit --no-fund --prefix /tmp/jakeli-arsenal-qa playwright@1.58.2
          /tmp/jakeli-arsenal-qa/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Verify original Commando appearance poses and all four weapons on mobile
        run: |
          python -m http.server 8823 --bind 127.0.0.1 >/tmp/commando-http.log 2>&1 &
          sleep 2
          node babylon/tests/test-commando-arsenal-browser.cjs
      - name: Upload experimental Commando model and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uk-commando-four-weapon-mobile-prototype
          path: |
            assets/allied-soldiers/uk-commando-*-prototype.glb
            babylon-qa-results/commando-arsenal/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish only unapproved experimental Commando into this branch
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = 'refs/heads/feature/british-army-10-stages-20261118'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/allied-soldiers/uk-commando-*-prototype.glb
          if git diff --cached --quiet; then
            echo 'Commando prototype unchanged'
          else
            git commit -m 'Publish separate unapproved British Commando four-weapon prototype [skip ci]'
            git pull --rebase origin feature/british-army-10-stages-20261118
            git push origin HEAD:refs/heads/feature/british-army-10-stages-20261118
          fi

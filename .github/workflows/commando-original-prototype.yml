name: Experimental original British Commando 65-bone prototype
on:
  push:
    branches:
      - feature/british-army-10-stages-20261118
    paths:
      - '.github/workflows/commando-original-prototype.yml'
      - 'tools/jakeli/build-commando-prototype.py'
      - 'tools/jakeli/test-commando-prototype.cjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: commando-original-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-commando-prototype:
    if: github.ref == 'refs/heads/feature/british-army-10-stages-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      COMMANDO_WEAPON: uk-sten
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/jakeli/requirements-blender.txt
      - name: Load pinned Blender runtime
        run: |
          python -m pip install --only-binary=:all: -r tools/jakeli/requirements-blender.txt
          python -c "import bpy; assert bpy.app.version == (4,3,0)"
      - name: Generate distinct original Commando geometry from anatomical donor skeleton
        run: python tools/jakeli/build-commando-prototype.py
      - name: Verify full 65-bone genuine clips separate jacket beret webbing and skin
        run: node tools/jakeli/test-commando-prototype.cjs
      - name: Upload experimental Commando model and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uk-commando-original-sten-prototype
          path: assets/allied-soldiers/uk-commando-sten-prototype.glb
          if-no-files-found: warn
          retention-days: 14
      - name: Publish only unapproved experimental Commando into this branch
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = 'refs/heads/feature/british-army-10-stages-20261118'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/allied-soldiers/uk-commando-sten-prototype.glb
          if git diff --cached --quiet; then
            echo 'Commando prototype unchanged'
          else
            git commit -m 'Publish separate unapproved British Commando Sten prototype [skip ci]'
            git pull --rebase origin feature/british-army-10-stages-20261118
            git push origin HEAD:refs/heads/feature/british-army-10-stages-20261118
          fi

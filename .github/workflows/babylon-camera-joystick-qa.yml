name: Battlefield camera and joystick checkpoint QA
on:
  push:
    branches:
      - feature/coh3-map-camera-joystick-20261122
    paths:
      - 'babylon/game.js'
      - 'babylon/game.parts/**'
      - 'babylon/index.html'
      - 'babylon/modern-art-v1.js'
      - 'babylon/tests/test-camera-joystick-checkpoint.cjs'
      - 'babylon/tests/test-visual-stability-mobile-browser.cjs'
      - '.github/workflows/babylon-camera-joystick-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node babylon/tools/assemble-game-parts.cjs --check
          node --check babylon/game.js
          node --check babylon/modern-art-v1.js
          node babylon/tests/test-ten-part-engineering.cjs
          node babylon/tests/test-camera-joystick-checkpoint.cjs
  phone-webgl:
    needs: checkpoint
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install mobile browser test engines
        run: |
          npm install --no-audit --no-fund --prefix /tmp/bf-mobile-visual playwright@1.58.2
          /tmp/bf-mobile-visual/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Test graphic assets and thumbstick movement at iPhone viewport
        run: |
          python3 -m http.server 8877 --bind 127.0.0.1 >/tmp/bf-visual-http.log 2>&1 &
          sleep 2
          node babylon/tests/test-visual-stability-mobile-browser.cjs
      - name: Keep screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battlefield-visual-stability-mobile
          path: babylon-qa-results/visual-stability/
          if-no-files-found: warn
          retention-days: 14

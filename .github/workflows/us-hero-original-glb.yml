name: American hero original GLB publish and QA
on:
  push:
    branches:
      - feature/us-hero-production-hold-piat-20261117
    paths:
      - "assets/allied-soldiers/quaternius-us-hero.parts/**"
      - "babylon/american-hero-production-v5-iphone.html"
      - "babylon/american-hero-weapon-rig-v5.js"
      - ".github/workflows/us-hero-original-glb.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify and combine the ORIGINAL Quaternius GLB
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,struct
          folder=Path('assets/allied-soldiers/quaternius-us-hero.parts')
          parts=sorted(folder.glob('part*.b64'))
          assert len(parts)==16,f'Expected exactly 16 model parts, got {len(parts)}'
          binary=b''.join(base64.b64decode(p.read_text().strip(),validate=True) for p in parts)
          assert len(binary)==4474936, 'GLB size mismatch'
          sha=hashlib.sha256(binary).hexdigest()
          assert sha=='082869ab37145cfc583fb4ad2e95c4ef3564e1a50d39137e085535670ed61f33','Original model SHA mismatch'
          assert binary[:4]==b'glTF','GLB header not found'
          json_size=struct.unpack_from('<I',binary,12)[0]
          gltf=json.loads(binary[20:20+json_size])
          assert len(gltf['skins'])==1 and len(gltf['skins'][0]['joints'])==65
          assert len(gltf['meshes'])==36
          assert [a['name'] for a in gltf['animations']]==['Idle_Quaternius','Walk_Quaternius','Jog_Quaternius','Sprint_Quaternius']
          Path('assets/allied-soldiers/us-hero-quaternius.glb').write_bytes(binary)
          print('HERO_GLB_OK',len(binary),sha)
          PY
      - name: Syntax and weapon QA
        shell: bash
        run: |
          node --check babylon/american-hero-weapon-rig-v5.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('babylon/american-hero-production-v5-iphone.html').read_text()
          assert 'uk-piat' in s and 'uk-bren' in s and 'uk-sten' in s and 'uk-lee-enfield' in s
          assert 'type="file"' not in s
          assert 'fetchHero()' in s
          r=Path('babylon/american-hero-weapon-rig-v5.js').read_text()
          assert 'orientAnatomicalHand' in r and 'createPiat' in r
          print('FOUR_WEAPONS_AND_AUTOSTART_OK')
          PY
      - name: Commit verified binary model to isolated feature branch
        shell: bash
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add assets/allied-soldiers/us-hero-quaternius.glb
          if ! git diff --cached --quiet; then
            git commit -m "Publish exact verified American hero Quaternius GLB [skip-hero-build]"
            git push origin HEAD:feature/us-hero-production-hold-piat-20261117
          fi

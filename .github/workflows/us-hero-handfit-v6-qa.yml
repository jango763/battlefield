name: US hero handfit v6 closeup QA
on:
  push:
    branches:
      - feature/us-hero-lee-enfield-handfit-v6-20261117
    paths:
      - 'babylon/us-hero-ara-lee-enfield-stage4.js'
      - 'babylon/tests/test-us-hero-handfit-v6-browser.cjs'
      - 'babylon/us-hero-lee-enfield-repaired-fingers-iphone.html'
      - '.github/workflows/us-hero-handfit-v6-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate clip isolation and single-rig hero structure
        run: node babylon/tests/test-us-hero-stage4-static.cjs
      - name: Install headless Chromium
        run: |
          npm install --no-audit --no-fund --prefix /tmp/stage4-qa playwright@1.58.2
          /tmp/stage4-qa/node_modules/.bin/playwright install chromium
      - name: Render hands from front and side; validate IK
        run: |
          python3 -m http.server 8758 --bind 127.0.0.1 >/tmp/stage4-http.log 2>&1 &
          sleep 2
          node babylon/tests/test-us-hero-handfit-v6-browser.cjs
      - name: Export visual closeups
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-hero-handfit-v6-closeups
          path: babylon-qa-results/handfit-v6/
          if-no-files-found: ignore

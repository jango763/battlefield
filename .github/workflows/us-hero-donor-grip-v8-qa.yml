name: US hero v8 rifle grip and skin QA
on:
  push:
    branches:
      - feature/us-hero-lee-enfield-grip-v8-20261117
    paths:
      - 'babylon/us-hero-ara-lee-enfield-stage4.js'
      - 'babylon/us-hero-lee-enfield-donor-grip-v8-iphone.html'
      - 'babylon/tests/test-us-hero-donor-grip-v8-browser.cjs'
      - '.github/workflows/us-hero-donor-grip-v8-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Verify no duplicated hand meshes and stage 4 rig
        run: node babylon/tests/test-us-hero-stage4-static.cjs
      - name: Install mobile Chromium
        run: |
          npm install --no-audit --no-fund --prefix /tmp/stage4-qa playwright@1.58.2
          /tmp/stage4-qa/node_modules/.bin/playwright install chromium
      - name: Render both rifle poses and compare finger-grip surfaces
        run: |
          python3 -m http.server 8758 --bind 127.0.0.1 >/tmp/stage4-http.log 2>&1 &
          sleep 2
          node babylon/tests/test-us-hero-donor-grip-v8-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: us-hero-donor-grip-v8-images
          path: babylon-qa-results/donor-grip-v8/
          if-no-files-found: ignore

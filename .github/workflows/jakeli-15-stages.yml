name: Jakeli 15-stage production gates
on:
  push:
    branches:
      - 'feature/british-army-10-stages-20261118'
    paths:
      - 'tools/jakeli/**'
      - 'babylon/JAKELI_15_STAGES.md'
      - '.github/workflows/jakeli-15-stages.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-verify-prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate Jakeli iPhone UI scripts before expensive browser tests
        run: node tools/jakeli/check-html-syntax.cjs
      - name: Verify model identity and 65 bone animation donor (steps 1-2)
        run: |
          node tools/jakeli/analyze-glb.mjs \
            assets/allied-soldiers/uk-jakeli-mobile-static.glb \
            assets/allied-soldiers/us-hero-quaternius-donor-hands-v7.glb > /tmp/jakeli-audit.log
          grep -F JAKELI_AUDIT_01_02_PASS /tmp/jakeli-audit.log
      - name: Align Jakeli geometry and transfer 65-bone skinning (steps 3-5 prototype)
        run: node tools/jakeli/build-prototype.mjs
      - name: Verify real Jakeli mesh, weights and Quaternius clips
        run: node tools/jakeli/verify-prototype.mjs
      - name: Set up Chromium on CI (not iPhone Safari)
        run: |
          npm install --no-audit --no-fund --prefix /tmp/jakeli-qa playwright@1.58.2
          /tmp/jakeli-qa/node_modules/.bin/playwright install chromium
      - name: Load actual Jakeli and test crossfades in mobile 390x844 Chromium
        run: |
          python3 -m http.server 8809 --bind 127.0.0.1 >/tmp/jakeli-http.log 2>&1 &
          sleep 2
          node babylon/tests/test-jakeli-65b-browser.cjs
      - name: Test authentic Jakeli with four approved two-hand IK weapons
        run: node babylon/tests/test-jakeli-weapons-browser.cjs
      - name: Upload four Jakeli weapon grip screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jakeli-four-weapons-ik-chromium
          path: babylon-qa-results/jakeli-weapons/
          if-no-files-found: ignore
      - name: Upload actual Jakeli pose screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jakeli-65-bone-mobile-chromium-poses
          path: babylon-qa-results/jakeli-65b/
          if-no-files-found: ignore
      - name: Publish strictly experimental artifact without touching main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/allied-soldiers/uk-jakeli-prototype-65b.glb
          if git diff --cached --quiet; then
            echo 'Jakeli prototype unchanged'
          else
            git commit -m 'Build 65-bone Jakeli visual prototype - not gameplay approved'
            git pull --rebase origin feature/british-army-10-stages-20261118
            git push origin HEAD:refs/heads/feature/british-army-10-stages-20261118
          fi

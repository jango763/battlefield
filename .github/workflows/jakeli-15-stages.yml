name: Jakeli 15-stage production gates
on:
  push:
    branches:
      - 'feature/british-army-10-stages-20261118'
    paths:
      - 'tools/jakeli/**'
      - 'babylon/jakeli-65b-iphone.html'
      - 'babylon/jakeli-weapons-iphone.html'
      - 'babylon/jakeli-lee-german-controller.html'
      - 'babylon/jakeli-lee-german-controller.js'
      - 'babylon/jakeli-combat-rig.js'
      - 'babylon/jakeli-three-squad-iphone.html'
      - 'babylon/tests/test-jakeli-*.cjs'
      - 'babylon/JAKELI_15_STAGES.md'
      - '.github/workflows/jakeli-15-stages.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-verify-prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preserve approved German donor as inspection-only CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: approved-german-65b-reference
          path: assets/soldiers/german.glb
          retention-days: 2
      - name: Validate Jakeli iPhone UI scripts before expensive browser tests
        run: node tools/jakeli/check-html-syntax.cjs
      - name: Verify model identity and 65 bone animation donor (steps 1-2)
        run: |
          node tools/jakeli/analyze-glb.mjs \
            assets/allied-soldiers/uk-jakeli-mobile-static.glb \
            assets/allied-soldiers/us-hero-quaternius-donor-hands-v7.glb > /tmp/jakeli-audit.log
          grep -F JAKELI_AUDIT_01_02_PASS /tmp/jakeli-audit.log
      - name: Install meshoptimizer for topology-preserving mobile reduction
        run: npm install --no-audit --no-fund --prefix /tmp/jakeli-meshopt meshoptimizer@1.1.1
      - name: Align Jakeli geometry and transfer 65-bone skinning (steps 3-5 prototype)
        run: node tools/jakeli/build-prototype.mjs
      - name: Verify real Jakeli mesh, weights and Quaternius clips
        run: node tools/jakeli/verify-prototype.mjs
      - name: Transfer real approved German hand skin weights to separate Jakeli comparison model
        run: |
          python3 -m venv /tmp/jakeli-artistskin
          /tmp/jakeli-artistskin/bin/pip install --quiet numpy scipy
          /tmp/jakeli-artistskin/bin/python tools/jakeli/transfer-german-hand-weights.py
      - name: Upload German-weighted hand comparison model (separate, not approved)
        uses: actions/upload-artifact@v4
        with:
          name: jakeli-german-artist-hand-skin
          path: assets/allied-soldiers/uk-jakeli-german-skin-v1.glb
          retention-days: 3
          if-no-files-found: error
      - name: Upload inspectable Jakeli 65-bone rig for visual deformation audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jakeli-prototype-65b-inspection
          path: assets/allied-soldiers/uk-jakeli-prototype-65b.glb
          retention-days: 3
          if-no-files-found: ignore
      - name: Set up Chromium on CI (not iPhone Safari)
        run: |
          npm install --no-audit --no-fund --prefix /tmp/jakeli-qa playwright@1.58.2
          /tmp/jakeli-qa/node_modules/.bin/playwright install chromium
      - name: Load actual Jakeli and test crossfades in mobile 390x844 Chromium
        run: |
          python3 -m http.server 8809 --bind 127.0.0.1 >/tmp/jakeli-http.log 2>&1 &
          sleep 2
          node babylon/tests/test-jakeli-65b-browser.cjs
      - name: Compare ONE Lee-Enfield using unchanged approved German IK
        run: node babylon/tests/test-jakeli-lee-german-controller.cjs
      - name: Upload one-rifle German IK comparison screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jakeli-lee-enfield-german-controller
          path: babylon-qa-results/jakeli-lee-german-controller/
          if-no-files-found: ignore
      - name: Test authentic Jakeli with four approved two-hand IK weapons
        run: node babylon/tests/test-jakeli-weapons-browser.cjs
      - name: Test German artist hand skin on actual Jakeli with four weapons
        run: JAKELI_GERMAN_HANDS=1 node babylon/tests/test-jakeli-weapons-browser.cjs
      - name: Upload German-weighted Jakeli four-weapon screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jakeli-german-artist-hand-qa
          path: babylon-qa-results/jakeli-weapons-german/
          if-no-files-found: ignore
      - name: Check three independent Jakeli rigs and two squad formations
        run: node babylon/tests/test-jakeli-three-squad-browser.cjs
      - name: Upload experimental British Jakeli squad screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jakeli-three-squad-chromium
          path: babylon-qa-results/jakeli-squad/
          if-no-files-found: ignore
      - name: Upload four Jakeli weapon grip screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jakeli-four-weapons-ik-chromium
          path: babylon-qa-results/jakeli-weapons/
          if-no-files-found: ignore
      - name: Upload actual Jakeli pose screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jakeli-65-bone-mobile-chromium-poses
          path: babylon-qa-results/jakeli-65b/
          if-no-files-found: ignore
      - name: Publish strictly experimental artifact without touching main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/allied-soldiers/uk-jakeli-prototype-65b.glb assets/allied-soldiers/uk-jakeli-german-skin-v1.glb
          if git diff --cached --quiet; then
            echo 'Jakeli prototype unchanged'
          else
            git commit -m 'Build 65-bone Jakeli visual prototype - not gameplay approved'
            git pull --rebase origin feature/british-army-10-stages-20261118
            git push origin HEAD:refs/heads/feature/british-army-10-stages-20261118
          fi

name: Wehrmacht 90-bone wardrobe
on:
  push:
    branches:
      - rig/wehrmacht90-video-review-20261115
  workflow_dispatch:
jobs:
  outfit:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JS
        run: |
          node --check --input-type=module < lab/wehrmacht90/app.js
          node lab/babylon/verify-assets.mjs
      - name: Install browser
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Runtime wardrobe and screenshot check
        run: |
          mkdir -p test-results
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/wehrmacht-http.log 2>&1 &
          sleep 2
          npx playwright test lab/wehrmacht90/material-audit.spec.js --reporter=line --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wehrmacht-preview
          path: test-results/
          if-no-files-found: ignore

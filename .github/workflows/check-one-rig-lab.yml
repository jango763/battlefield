name: One-rig WW2 uniform comparison
on:
  push:
    branches: [lab/one-rig-rebind-20261114]
    paths:
      - 'lab/one-rig/**'
      - '.github/workflows/check-one-rig-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  one-rig-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Validate JS syntax
        run: |
          node --check --input-type=module < lab/one-rig/app.js
          node --check lab/one-rig/test-browser.cjs
      - name: Install browser test dependencies
        run: |
          npm install --no-audit --no-fund --prefix /tmp/r187-lab-qa playwright@1.58.2
          /tmp/r187-lab-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Inspect actual GLB one skeleton on desktop and mobile
        run: |
          python3 -m http.server 8777 --bind 127.0.0.1 >/tmp/one-rig-server.log 2>&1 &
          sleep 2
          node lab/one-rig/test-browser.cjs
      - name: Preserve screenshots of rebind comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-rig-real-ww2-model-screenshots
          path: /tmp/r187-lab-*.png
          if-no-files-found: warn

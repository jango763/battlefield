name: Compare native hero wrist angles
on:
  push:
    branches: [fix/hero-headwear-wrists-status-20261114]
    paths: [.github/workflows/check-wrist-pose-candidates.yml]
permissions:
  contents: read
jobs:
  visuals:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install browser and image tools
        run: |
          npm install --no-audit --no-fund --prefix /tmp/ww2-playwright playwright@1.58.2
          /tmp/ww2-playwright/node_modules/.bin/playwright install chromium
          python3 -m pip install --quiet pillow
      - name: Capture candidate wrist rotations for each grip
        shell: bash
        run: |
          python3 -m http.server 8777 --bind 127.0.0.1 >/tmp/wrist-server.log 2>&1 &
          sleep 2
          node - <<'JS'
          const {chromium}=require('/tmp/ww2-playwright/node_modules/playwright'),fs=require('fs');
          (async()=>{
            const report={success:false,frames:[],errors:[]};let browser;
            try{
              browser=await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader','--enable-webgl','--no-sandbox']});
              const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:1});
              page.on('pageerror',e=>{if(report.errors.length<12)report.errors.push(e.message)});
              await page.goto('http://127.0.0.1:8777/preview/formation-replenishment-v3.html',{waitUntil:'domcontentloaded',timeout:45000});
              await page.waitForFunction(()=>{try{return !!(P&&P.germanPreview?.nativeRig?.weapon?.ww2Manifest&&P.germanPreview?.nativeRig?.ww2Uniform?.cap)}catch(e){return false}},null,{timeout:100000});
              await page.evaluate(()=>{
                P.side='red';P.wpn=1;P.sv=0;P.aim=0;P.aimT=P.g.rotation.y;
                scene.background=new THREE.Color(0xa6aaa6);
                for(const node of scene.children)if(node!==P.g&&!node.isLight)node.visible=false;
                const old=cam.updateMatrixWorld.bind(cam);
                cam.updateMatrixWorld=function(force){
                  this.position.set(P.x+1.5,2.9,P.z+3.3);
                  this.lookAt(P.x,1.4,P.z);
                  return old(force);
                };
              });
              await page.waitForFunction(()=>{
                P.wpn=1;animateNativeHeroRig(P,P.germanPreview,1/60);
                return P.germanPreview.nativeRig.weapon.activeModelId==='de-mp40';
              },null,{timeout:45000});
              const variants=[
                ['baseline',[0,0,0],[0,0,0]],
                ['x-plus',[.95,0,0],[.95,0,0]],
                ['x-minus',[-.95,0,0],[-.95,0,0]],
                ['y-plus',[0,.95,0],[0,.95,0]],
                ['y-minus',[0,-.95,0],[0,-.95,0]],
                ['z-plus',[0,0,.95],[0,0,.95]],
                ['z-minus',[0,0,-.95],[0,0,-.95]],
                ['opposite-z',[0,0,.95],[0,0,-.95]],
                ['opposite-y',[0,.95,0],[0,-.95,0]]
              ];
              for(const [name,left,right] of variants){
                const data=await page.evaluate(({left,right})=>{
                  window.__ww2WristProbe={left,right};
                  for(let i=0;i<12;i++)animateNativeHeroRig(P,P.germanPreview,1/60);
                  const r=P.germanPreview.nativeRig;
                  return {leftError:r.weaponDiagnostics.visibleLeftError,rightError:r.weaponDiagnostics.visibleRightError};
                },{left,right});
                await page.waitForTimeout(90);
                await page.screenshot({path:'/tmp/wrist-'+name+'.png'});
                report.frames.push({name,...data});
              }
              report.success=true;
            }catch(e){report.errors.push(e.stack)}
            finally{fs.writeFileSync('/tmp/wrist-variants.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));if(browser)await browser.close();if(!report.success)process.exitCode=1}
          })();
          JS
      - name: Assemble preview contact sheet and stream it
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from PIL import Image,ImageDraw
          import pathlib,base64
          names=['baseline','x-plus','x-minus','y-plus','y-minus','z-plus','z-minus','opposite-z','opposite-y']
          tilew,tileh=250,365
          sheet=Image.new('RGB',(tilew*3,tileh*3),'#252525')
          draw=ImageDraw.Draw(sheet)
          for i,name in enumerate(names):
              src=pathlib.Path('/tmp/wrist-'+name+'.png')
              if not src.exists():continue
              im=Image.open(src).convert('RGB')
              crop=im.crop((70,110,340,760))
              crop.thumbnail((244,337))
              x=(i%3)*tilew+3
              y=(i//3)*tileh+25
              sheet.paste(crop,(x,y))
              draw.text(((i%3)*tilew+10,(i//3)*tileh+7),name,fill='#eeeeee')
          sheet.save('/tmp/wrist-contact.jpg',quality=83)
          d=base64.b64encode(pathlib.Path('/tmp/wrist-contact.jpg').read_bytes()).decode()
          print('WRIST_SHEET_START',len(d))
          for k in range(0,len(d),51000):print('WRIST_SHEET_PART '+d[k:k+51000])
          print('WRIST_SHEET_END')
          PY
      - name: Archive QA images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-wrist-pose-candidates
          path: |
            /tmp/wrist-contact.jpg
            /tmp/wrist-variants.json
          if-no-files-found: warn

name: Babylon combat animation validation
on:
  workflow_dispatch:
  push:
    branches: [lab/babylon-fast-prototype-20261114]
    paths:
      - 'lab/babylon/**'
      - 'assets/native-hero-quaternius/**'
      - 'assets/ww2-weapons/**'
      - '.github/workflows/babylon-combat.yml'
jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate GLB skeleton, animations and MP40 manifest
        run: node lab/babylon/verify-assets.mjs\n      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 8765 > /tmp/battlefield-server.log 2>&1 &
      - name: Test Babylon animation modes and combat grip
        run: node lab/babylon/verify-combat.mjs
      - name: Upload combat inspection and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combat-inspection
          path: |\n            combat-inspection.png\n            combat-failure.png
          if-no-files-found: ignore

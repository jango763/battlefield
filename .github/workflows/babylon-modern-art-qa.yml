name: Babylon Modern Battlefield PBR art QA
on:
  push:
    branches:
      - feature/babylon-modern-art-v1-20261121
    paths:
      - 'babylon/modern-art-v1.js'
      - 'babylon/game.js'
      - 'babylon/index.html'
      - 'babylon/art/**'
      - 'babylon/tests/test-modern-art.cjs'
      - 'babylon/tests/test-modern-art-browser.cjs'
      - '.github/workflows/babylon-modern-art-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: battlefield-modern-art-${{ github.ref }}
  cancel-in-progress: true
jobs:
  art-validity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate PBR image rights and asset bytes, geometry, legacy gameplay
        run: |
          node --check babylon/modern-art-v1.js
          node --check babylon/game.js
          node --check babylon/tests/test-modern-art-browser.cjs
          node babylon/tests/test-modern-art.cjs
          node babylon/tests/test-first-game-behavior.cjs
          node babylon/tests/test-continuous-reinforcements.cjs
  iphone-render:
    needs: art-validity
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium and WebKit phone renderers
        run: |
          npm install --no-audit --no-fund --prefix /tmp/bf-art-2026 playwright@1.58.2
          /tmp/bf-art-2026/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Render old vs new scene and assert scanned PBR
        run: |
          python3 -m http.server 8862 --bind 127.0.0.1 >/tmp/bf-modern-art-server.log 2>&1 &
          sleep 2
          node babylon/tests/test-modern-art-browser.cjs
      - name: Preserve screenshot A/B proof and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battlefield-modern-art-2026-iphone-comparison
          path: babylon-qa-results/modern-art-2026/
          if-no-files-found: warn
          retention-days: 14

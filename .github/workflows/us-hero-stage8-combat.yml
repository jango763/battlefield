name: US hero stage 8 shooting reload and Quaternius motion
on:
  push:
    branches:
      - feature/us-hero-combat-reload-motion-stage8-20261117
    paths:
      - 'babylon/us-hero-stage8-*.js'
      - 'babylon/us-hero-stage8-combat-iphone.html'
      - 'babylon/tests/test-us-hero-stage8-*.cjs'
      - '.github/workflows/us-hero-stage8-combat.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  combat:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Verify combat modules and original American/Allied assets
        run: |
          node --check babylon/us-hero-stage8-rig.js
          node --check babylon/us-hero-stage8-combat.js
          node --check babylon/us-hero-stage8-effects.js
          node --check babylon/tests/test-us-hero-stage8-browser.cjs
          test -s assets/allied-soldiers/us-hero-quaternius-donor-hands-v7.glb
          test -s assets/ww2-weapons/uk-lee-enfield.glb
          test -s assets/ww2-weapons/uk-sten.glb
          test -s assets/ww2-weapons/uk-bren.glb
      - name: Validate rifle infinity, Sten/Bren/PIAT ammunition and frame independence
        run: node babylon/tests/test-us-hero-stage8-combat.cjs
      - name: Install mobile Chromium
        run: |
          npm install --no-audit --no-fund --prefix /tmp/stage8-qa playwright@1.58.2
          /tmp/stage8-qa/node_modules/.bin/playwright install chromium
      - name: Test interactive shooting, reload, muzzle FX, movement and PIAT fallback
        run: |
          python3 -m http.server 8788 --bind 127.0.0.1 >/tmp/stage8-http.log 2>&1 &
          sleep 2
          node babylon/tests/test-us-hero-stage8-browser.cjs
      - name: Export mobile QA images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-hero-stage8-shoot-reload-motion-qa
          path: babylon-qa-results/us-hero-stage8/
          if-no-files-found: ignore

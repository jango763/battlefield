name: British mirror squad QA
on:
  push:
    branches:
      - feature/british-mirror-skin-v1-20261116
      - feature/allied-four-models-hero-20261116
    paths:
      - 'babylon/**'
      - 'assets/ww2-weapons/**'
      - '.github/workflows/british-mirror-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mirror:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and mirrored-army regression checks
        run: |
          node --check babylon/game.js
          node --check babylon/weapon-rig.js
          node --check babylon/british-faction.js
          node --check babylon/british-soldier-original.js
          node --check babylon/allied-model-catalog.js
          node babylon/tests/test-allied-casting.cjs
          node babylon/tests/test-british-mirror.cjs
          node babylon/tests/test-weapon-balance.cjs
          node babylon/tests/test-game-entry.cjs
          node babylon/tests/test-central-unlock.cjs

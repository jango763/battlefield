name: Battlefield CoH3-style countryside: daylight, verges, native-touch QA
on:
  push:
    branches:
      - feature/babylon-coh3-terrain-readability-20261122
    paths:
      - 'babylon/game.js'
      - 'babylon/game.parts/**'
      - 'babylon/index.html'
      - 'babylon/world-300.js'
      - 'babylon/modern-art-v1.js'
      - 'babylon/tactical-camera.js'
      - 'babylon/mobile-thumbstick.js'
      - 'babylon/tactical-map-detail.js'
      - 'babylon/tests/test-tactical-controls.cjs'
      - 'babylon/tests/test-first-game-behavior.cjs'
      - 'babylon/tests/test-tactical-camera-stick-browser.cjs'
      - '.github/workflows/babylon-tactical-camera-map-stick-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: battlefield-tactical-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Verify ten equal game parts and exact browser runtime
        run: |
          node babylon/tools/assemble-game-parts.cjs --check
          node --check babylon/game.js
          node --check babylon/tactical-camera.js
          node --check babylon/mobile-thumbstick.js
          node --check babylon/tactical-map-detail.js
          node babylon/tests/test-ten-part-engineering.cjs
          node babylon/tests/test-tactical-controls.cjs
      - name: Preserve old army, economy and actor movement contracts
        run: |
          node babylon/tests/test-first-game-behavior.cjs
          node babylon/tests/test-continuous-reinforcements.cjs
          node babylon/tests/test-unit-motion-unifier.cjs
  mobile-acceptance:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Install mobile Chromium
        run: |
          npm install --no-audit --no-fund --prefix /tmp/bf-tactical-camera playwright@1.58.2
          /tmp/bf-tactical-camera/node_modules/.bin/playwright install --with-deps chromium
      - name: Load true WW2 soldiers and measure joystick movement with the tactical view
        run: |
          python3 -m http.server 8877 --bind 127.0.0.1 >/tmp/bf-tactical-server.log 2>&1 &
          sleep 2
          node babylon/tests/test-tactical-camera-stick-browser.cjs
      - name: Retain rendered mobile map and joystick acceptance screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battlefield-tactical-camera-joystick-map
          path: /tmp/bf-coh3-style-mobile.jpg
          if-no-files-found: warn
          retention-days: 14

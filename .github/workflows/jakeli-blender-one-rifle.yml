name: Jakeli anatomical bind and one-rifle QA
on:
  push:
    branches: [feature/british-army-10-stages-20261118]
    paths:
      - 'tools/jakeli/**'
      - 'babylon/jakeli-blender-lee-*'
      - 'babylon/tests/test-jakeli-blender-lee-browser.cjs'
      - 'assets/allied-soldiers/uk-jakeli-anatomical-v2.glb'
      - '.github/workflows/jakeli-blender-one-rifle.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jakeli-anatomical-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rebind:
    if: github.ref == 'refs/heads/feature/british-army-10-stages-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/jakeli/requirements-blender.txt
      - name: Install pinned official Blender Python runtime
        run: |
          python -m pip install --only-binary=:all: -r tools/jakeli/requirements-blender.txt
          python -c "import bpy; assert bpy.app.version == (4,3,0); print('BLENDER', bpy.app.version_string)"
      - name: Rebuild from locked original geometry and render actual surfaces
        run: python tools/jakeli/blender-rebind-german-armature.py
      - name: Verify source preservation, bind matrices, weights and every clip
        run: python tools/jakeli/verify-anatomical.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser QA on mobile Chromium and WebKit
        run: |
          npm install --no-audit --no-fund --prefix /tmp/jakeli-blender-qa playwright@1.58.2
          /tmp/jakeli-blender-qa/node_modules/.bin/playwright install --with-deps chromium webkit
          python -m http.server 8810 --bind 127.0.0.1 >/tmp/jakeli-http.log 2>&1 &
          node babylon/tests/test-jakeli-blender-lee-browser.cjs
      - name: Upload evidence, model and editable Blender project even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jakeli-anatomical-evidence
          path: |
            assets/allied-soldiers/uk-jakeli-anatomical-v2.glb
            babylon-qa-results/jakeli-anatomical/
            babylon-qa-results/jakeli-blender-lee-screen/
          retention-days: 14

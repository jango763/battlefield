<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Battlefield — Babylon · прототип тактики</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171d17;color:#eee;font:14px system-ui}canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;padding:10px;background:#18241bdc;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{background:#415b40;color:white;border:1px solid #8da184;border-radius:6px;padding:9px}button[aria-pressed=true]{background:#a3bc86;color:#172119}#status{font-size:12px;flex:1;min-width:190px}.help{position:fixed;bottom:env(safe-area-inset-bottom,8px);left:10px;background:#172019cc;padding:8px;border-radius:6px;font-size:12px;max-width:90%}</style>
<script src="https://cdn.babylonjs.com/babylon.js"></script></head><body>
<canvas id="view"></canvas><div class="hud"><b>Battlefield · Babylon</b><button id="select">Выбрать отряд</button><button id="move" aria-pressed="true">Перемещение</button><button id="attack">Атака</button><button id="reset">Перезапуск</button><span id="status">Загрузка…</span></div><div class="help">Нажми на землю — приказ отряду. Режим «Атака»: нажми на врага. На ПК: правая кнопка — перемещение, колесо — масштаб.</div>
<script type="module" src="./combat.js"></script></body></html>

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#202722">
  <title>Battlefield · Babylon.js · немецкий стрелок</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#202722;color:#f5f3e8;font:14px system-ui,-apple-system,Segoe UI,sans-serif}
    #renderCanvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
    #title{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:16px;right:16px;pointer-events:none;text-shadow:0 2px 8px #0008}
    h1{font-size:17px;margin:0 0 5px;font-weight:700}
    #subtitle{font-size:12px;color:#d5dfd2}
    #status{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);left:12px;right:12px;text-align:center;font-size:12px;color:#e6eadf;background:#243026bd;padding:8px 10px;border:1px solid #57675b;border-radius:9px}
    #status[data-ready="true"]{opacity:.65}
    #error{position:fixed;top:90px;left:12px;right:12px;text-align:center;color:#ffd1bd;display:none}
    #credit{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 64px);left:12px;right:12px;font-size:11px;text-align:center;color:#b8c5b4}
    #credit a{color:#d4dfc6}
  </style>
</head>
<body>
  <canvas id="renderCanvas" aria-label="Немецкий солдат в 3D. Вращайте пальцем для просмотра."></canvas>
  <div id="title"><h1>Battlefield · Babylon.js</h1><div id="subtitle">Немецкий стрелок · оригинальная модель без переделок</div></div>
  <div id="error" role="alert"></div>
  <div id="credit">WW2 Panzergrenadier 2k · britdawgmasterfunk · CC BY 4.0 · <a href="https://sketchfab.com/3d-models/ww2-panzergrenadier-2k-cc0-6a104431bcb8400080b79446ec019696" target="_blank" rel="noopener noreferrer">Автор модели</a></div>
  <div id="status" role="status">Загрузка персонажа…</div>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  <script src="./main.js"></script>
</body>
</html>

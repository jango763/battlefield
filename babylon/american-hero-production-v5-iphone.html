<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#192820">
<title>Battlefield — американский герой, 4 оружия</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#152119;color:#eaf3e9;font:13px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;overflow:hidden}
canvas{width:100%;height:100%;display:block;touch-action:none}
header{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:12px;right:12px;pointer-events:none;text-shadow:0 2px 6px #000c}
header h1{font-size:17px;margin:0 0 4px}header p{font-size:11px;color:#c0cfc2;margin:0}
#panel{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 8px);left:8px;right:8px;max-width:720px;margin:auto;border:1px solid #728e76;border-radius:12px;padding:9px;background:#1b3026ec;box-shadow:0 4px 25px #0009}
#actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
button{min-height:44px;border:1px solid #7a967d;border-radius:8px;background:#39573f;color:#edf5e7;font:700 12px system-ui;touch-action:manipulation;padding:4px 1px}
button:disabled{opacity:.35}button[aria-pressed=true]{background:#d8e8af;color:#172b1c}
#status{font-size:12px;color:#f3dfab;white-space:pre-line;line-height:1.45;min-height:36px;margin:5px 0 9px;overflow-wrap:anywhere}
#metrics{font-size:11px;color:#c6dfc3;margin-top:7px;line-height:1.4}
footer{font-size:10px;color:#becfbb;margin-top:5px}
@media(max-width:385px){#panel{padding:6px}button{font-size:10px}}
</style>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
<script src="./native-clip-blend.js"></script>
<script src="./american-hero-weapon-rig-v5.js"></script>
</head><body>
<canvas id="view" aria-label="Американский герой с оружием"></canvas>
<header><h1>Battlefield · герой · четыре вида оружия</h1><p>Babylon.js · Quaternius · без ручной загрузки модели</p></header>
<section id="panel"><div id="status" role="status" aria-live="polite">Автоматически загружаю героя из GitHub…</div>
<div id="actions">
<button data-motion="Idle_Quaternius" aria-pressed="true" disabled>Стойка</button>
<button data-motion="Walk_Quaternius" disabled>Ходьба</button>
<button data-motion="Jog_Quaternius" disabled>Бег</button>
<button data-motion="Sprint_Quaternius" disabled>Спринт</button>
<button data-weapon="uk-lee-enfield" aria-pressed="true" disabled>Lee-Enfield</button>
<button data-weapon="uk-sten" disabled>Sten</button>
<button data-weapon="uk-bren" disabled>Bren</button>
<button data-weapon="uk-piat" disabled>PIAT</button>
</div>
<div id="metrics">Один скелет · две кисти · диагностика хвата</div>
<footer>PIAT пока процедурный макет. Вращай одним пальцем, приближай двумя. Рабочую игру не изменяем.</footer>
</section>
<script>
(async function(){
'use strict';
const B=window.BABYLON,blend=window.BattlefieldNativeClipBlend,ik=window.BattlefieldAmericanTwoHandIK;
const $=id=>document.getElementById(id),status=$('status'),metrics=$('metrics');
const qa={ready:false,error:null,downloadParts:0,modelBytes:0,weaponId:null,motion:null,fps:0};
window.__BATTLEFIELD_US_HERO_V5__=qa;
const say=s=>{status.textContent=s};
if(!B?.SceneLoader||!blend||!ik){qa.error='Не загрузились Babylon.js или модули анимации';say(qa.error);return}
let engine,scene,camera,active=null,weaponState={};
try{
 engine=new B.Engine($('view'),true,{powerPreference:'high-performance',stencil:true});
 engine.setHardwareScalingLevel(Math.max(1,(devicePixelRatio||1)/1.6));
 scene=new B.Scene(engine);scene.useRightHandedSystem=true;scene.clearColor=new B.Color4(.08,.13,.1,1);
 const a=new B.HemisphericLight('ambient',new B.Vector3(0,1,0),scene);a.intensity=1.55;
 const k=new B.DirectionalLight('key',new B.Vector3(-.7,-1,-.6),scene);k.intensity=1.2;
 const rim=new B.DirectionalLight('rim',new B.Vector3(.8,-.4,.7),scene);rim.intensity=.6;
 camera=new B.ArcRotateCamera('orbit',Math.PI/2,Math.PI*.43,3,new B.Vector3(0,.95,0),scene);
 camera.lowerRadiusLimit=.9;camera.upperRadiusLimit=7;camera.pinchDeltaPercentage=.019;camera.attachControl($('view'),true);
 const ground=B.MeshBuilder.CreateDisc('ground',{radius:1.35,tessellation:48},scene);ground.rotation.x=Math.PI/2;ground.position.y=-.025;
 const gm=new B.StandardMaterial('earth',scene);gm.diffuseColor=new B.Color3(.2,.27,.19);ground.material=gm;
 let timer=0;
 engine.runRenderLoop(()=>{
  const dt=Math.min(.05,engine.getDeltaTime()/1000);
  if(active)blend.update(active,dt);
  timer+=dt;
  if(timer>.65){timer=0;qa.fps=Math.round(engine.getFps());const r=weaponState.weaponRig;
   if(qa.ready&&r){const cm=v=>Number.isFinite(v)?Math.round(v*100)+' см':'?';const deg=v=>Number.isFinite(v)?Math.round(v)+'°':'?';
    metrics.textContent='FPS '+qa.fps+' · IK: П '+cm(r.rightGripMeters)+' / Л '+cm(r.leftGripMeters)+
     ' · пальцы: П '+deg(r.rightFingerDegrees)+' / Л '+deg(r.leftFingerDegrees)+
     ' · приклад '+cm(r.stockToShoulderMeters)+(r.error?' · Ошибка '+r.error:'');
   }
  }
  scene.render();
 });
 window.addEventListener('resize',()=>engine.resize());
}catch(e){qa.error=String(e?.message||e);say('3D не запустилось: '+qa.error);return}
async function fetchHero(){
 const source="../assets/allied-soldiers/us-hero-quaternius.glb";
 say("Загружаю героя из GitHub (4,3 МБ)…");
 const response=await fetch(source);
 if(!response.ok)throw Error("GLB героя в GitHub: HTTP "+response.status);
 const blob=await response.blob();
 if(blob.size!==4474936)throw Error("Неверный размер GLB: "+blob.size);
 const magic=new DataView(await blob.slice(0,12).arrayBuffer());
 if(magic.getUint32(0,true)!==0x46546c67||magic.getUint32(8,true)!==blob.size)
   throw Error("Неправильный заголовок GLB");
 if(window.crypto?.subtle){
  const raw=await blob.arrayBuffer();
  const digest=Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256",raw)))
    .map(v=>v.toString(16).padStart(2,"0")).join("");
  if(digest!=="082869ab37145cfc583fb4ad2e95c4ef3564e1a50d39137e085535670ed61f33")
    throw Error("Контрольная сумма GLB не совпадает");
 }
 qa.downloadParts=1;qa.modelBytes=blob.size;
 return blob;
}

const motionButtons=[...document.querySelectorAll('[data-motion]')];
const weaponButtons=[...document.querySelectorAll('[data-weapon]')];
function play(name){
 if(!active||!active.clips.has(name))return;
 blend.play(active,active.clips.get(name),name==='Idle_Quaternius'?'ready':'run',{loop:true,duration:.22});
 weaponState.setWeaponPose?.(name==='Idle_Quaternius'?'ready':'run');
 qa.motion=name;motionButtons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.motion===name)));
 say('Герой · '+name.replace('_Quaternius','')+' · '+qa.weaponId+' · Проверь хват рук.');
}
motionButtons.forEach(b=>b.addEventListener('click',()=>{try{play(b.dataset.motion)}catch(e){say(String(e))}}));
weaponButtons.forEach(b=>b.addEventListener('click',async()=>{
 if(!qa.ready)return;weaponButtons.forEach(x=>x.disabled=true);say('Экипирую '+b.textContent+'…');
 try{await weaponState.equipWeapon(b.dataset.weapon);qa.weaponId=b.dataset.weapon;
  weaponButtons.forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  say('Выбрано '+b.textContent+'. Смотри кисти и направление пальцев.')
 }catch(e){qa.error=String(e?.message||e);say('Ошибка оружия: '+qa.error)}
 finally{weaponButtons.forEach(x=>x.disabled=false)}
}));
try{
 const blob=await fetchHero(),objectUrl=URL.createObjectURL(blob);
 say('Загружаю скелет и оригинальные текстуры…');let imported;
 try{imported=await B.SceneLoader.ImportMeshAsync(null,'',objectUrl,scene,undefined,'.glb')}
 finally{URL.revokeObjectURL(objectUrl)}
 if(imported.skeletons.length!==1||imported.skeletons[0].bones.length!==65)throw Error('У героя должен быть один скелет из 65 костей');
 const clips=new Map(imported.animationGroups.map(a=>[a.name,a]));
 if(['Idle_Quaternius','Walk_Quaternius','Jog_Quaternius','Sprint_Quaternius'].some(n=>!clips.has(n)))throw Error('Нет четырёх нужных анимаций');
 imported.animationGroups.forEach(g=>g.stop());
 const meshes=imported.meshes.filter(m=>m.getTotalVertices?.()>0);
 if(meshes.length!==36)throw Error('Неожиданное количество частей героя '+meshes.length);
 const min=new B.Vector3(Infinity,Infinity,Infinity),max=new B.Vector3(-Infinity,-Infinity,-Infinity);
 for(const mesh of meshes){mesh.computeWorldMatrix(true);const b=mesh.getBoundingInfo().boundingBox;min.minimizeInPlace(b.minimumWorld);max.maximizeInPlace(b.maximumWorld)}
 const h=max.y-min.y;if(!Number.isFinite(h)||h<=0)throw Error('Некорректный размер героя');
 const stage=new B.TransformNode('american-hero-stage',scene);
 for(const n of imported.meshes)if(!n.parent)n.parent=stage;
 for(const n of imported.transformNodes)if(!n.parent)n.parent=stage;
 const factor=1.8/h;stage.scaling.setAll(factor);stage.position.set(-(min.x+max.x)*.5*factor,-min.y*factor,-(min.z+max.z)*.5*factor);
 camera.setTarget(new B.Vector3(0,.93,0));camera.radius=2.95;
 await ik.create({scene,imported,root:stage,state:weaponState,weaponRoot:'../assets/ww2-weapons/'});
 if(!weaponState.weaponRigReady)throw Error('Новая система хвата не инициализировалась');
 active={clips,clip:null,motionBlend:null};qa.ready=true;qa.weaponId='uk-lee-enfield';
 motionButtons.concat(weaponButtons).forEach(b=>b.disabled=false);
 play('Idle_Quaternius');
}catch(e){qa.error=String(e?.message||e);say('Ошибка: '+qa.error+'\nОбнови страницу. Модель вручную выбирать не требуется.');console.error(e)}
})();
</script></body></html>

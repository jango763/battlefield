<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1050" role="img" aria-labelledby="title desc">
<title id="title">Battlefield: схема карты 300 на 300, британцы синие против немцев красных</title>
<desc id="desc">Северная база Вермахта сверху, южная британская база снизу, четыре обычные фермы по флангам, богатая нейтральная ферма в центре, семь ДОТов и три сожжённых БТР колонной у дороги</desc>
<defs>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 H0 V40" fill="none" stroke="#c4aa6f" opacity=".14" stroke-width="1"/></pattern>
 <pattern id="earth" width="80" height="80" patternUnits="userSpaceOnUse"><rect width="80" height="80" fill="#343928"/><path d="M2 0L28 15 47 8 73 42 62 71 26 79" stroke="#62714b" opacity=".34" stroke-width="9" fill="none"/><circle cx="52" cy="28" r="9" fill="#5e6046" opacity=".4"/></pattern>
 <linearGradient id="gold"><stop stop-color="#ffe9a0"/><stop offset=".55" stop-color="#d59d26"/><stop offset="1" stop-color="#725314"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="8"/></filter>
 <g id="bunker"><path d="M-20 14V-10 L-11 -20 H11 L20 -10 V14 Z" fill="#7c8173" stroke="#d2caba" stroke-width="3"/><rect x="-12" y="-9" width="24" height="7" rx="2" fill="#1c221a"/><path d="M-25 19H25" stroke="#232922" stroke-width="5"/></g>
 <g id="farm"><rect x="-22" y="-16" width="44" height="32" rx="2" fill="#a08a60" stroke="#f3dfa5" stroke-width="2"/><path d="M-26 -13L0 -33 26 -13Z" fill="#68452d" stroke="#cf9f61" stroke-width="2"/><rect x="-7" y="0" width="14" height="16" fill="#41372a"/><circle cx="28" cy="6" r="10" fill="url(#gold)" stroke="#ffe69b" stroke-width="2"/></g>
 <g id="wreck"><rect x="-22" y="-12" width="44" height="24" rx="5" fill="#35312e" stroke="#9b755b" stroke-width="2"/><path d="M-12 -16 L-10 -5 10 -5 15 -15 M-19 17L-15 8 18 8 23 16" fill="none" stroke="#9a6850" stroke-width="4"/><circle cx="-8" cy="0" r="7" fill="#201d1b"/><circle cx="13" cy="0" r="6" fill="#201d1b"/></g>
</defs>
<rect width="1000" height="1050" fill="#171a16"/>
<text x="45" y="47" fill="#ede1bc" font-family="sans-serif" font-size="31" font-weight="bold">КАРТА «ПЕРЕКРЁСТОК»</text>
<text x="955" y="47" fill="#efd59e" font-family="sans-serif" font-size="25" font-weight="bold" text-anchor="end">300 × 300</text>
<rect x="45" y="80" width="910" height="868" rx="7" fill="url(#earth)" stroke="#b4ae91" stroke-width="3"/>
<rect x="45" y="80" width="910" height="868" fill="url(#grid)"/>
<g opacity=".45" fill="none" stroke="#b2a27d"><path stroke-width="28" d="M500 91Q485 300 502 530T500 941"/><path stroke-width="20" d="M70 530Q370 510 500 525T937 531"/><path stroke-width="9" d="M500 420Q350 430 238 335M500 420Q650 430 782 335M500 638Q350 630 240 705M500 638Q650 625 780 704"/></g>
<g fill="#31442c" opacity=".92">
 <ellipse cx="115" cy="145" rx="47" ry="60"/><ellipse cx="163" cy="176" rx="30" ry="39"/>
 <ellipse cx="867" cy="175" rx="44" ry="57"/><ellipse cx="900" cy="250" rx="23" ry="43"/>
 <ellipse cx="95" cy="865" rx="37" ry="52"/><ellipse cx="860" cy="848" rx="55" ry="51"/>
 <ellipse cx="90" cy="450" rx="28" ry="80"/><ellipse cx="912" cy="460" rx="28" ry="80"/>
</g>
<g>
 <rect x="335" y="97" width="330" height="100" rx="14" fill="#571f1d" fill-opacity=".83" stroke="#db6555" stroke-width="5"/>
 <rect x="335" y="839" width="330" height="93" rx="14" fill="#183c5b" fill-opacity=".87" stroke="#69a9e8" stroke-width="5"/>
 <text x="500" y="135" font-size="23" fill="#ffe8dd" text-anchor="middle" font-weight="bold" font-family="sans-serif">СЕВЕРНАЯ БАЗА</text>
 <text x="500" y="170" font-size="20" fill="#eeb2a1" text-anchor="middle" font-family="sans-serif">НЕМЦЫ · ВЕРМАХТ</text>
 <text x="500" y="875" font-size="22" fill="#d3e8ff" text-anchor="middle" font-weight="bold" font-family="sans-serif">ЮЖНАЯ БАЗА</text>
 <text x="500" y="908" font-size="22" fill="#aed4ff" text-anchor="middle" font-family="sans-serif">БРИТАНЦЫ · СИНИЕ</text>
</g>
<g>
 <use href="#farm" transform="translate(235 330)"/><use href="#farm" transform="translate(765 330)"/>
 <use href="#farm" transform="translate(235 706)"/><use href="#farm" transform="translate(765 706)"/>
 <g font-family="sans-serif" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff2c0">
 <text x="235" y="382">ФЕРМА Б1</text><text x="235" y="402" font-size="15">+25 / 5 сек</text>
 <text x="765" y="382">ФЕРМА Б2</text><text x="765" y="402" font-size="15">+25 / 5 сек</text>
 <text x="235" y="758">ФЕРМА А1</text><text x="235" y="778" font-size="15">+25 / 5 сек</text>
 <text x="765" y="758">ФЕРМА А2</text><text x="765" y="778" font-size="15">+25 / 5 сек</text></g>
</g>
<g><circle cx="500" cy="528" r="89" fill="#d19720" opacity=".24" filter="url(#glow)"/>
<circle cx="500" cy="528" r="72" fill="#68501f" stroke="#ffdb64" stroke-dasharray="7 5" stroke-width="5"/>
<use href="#farm" transform="translate(500 513) scale(1.5)"/>
<text x="500" y="578" fill="#ffec9e" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="20">ЦЕНТРАЛЬНАЯ ФЕРМА</text>
<text x="500" y="604" fill="#fff4ad" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="19">+125 ЗОЛОТА / 5 СЕК</text>
</g>
<g><use href="#bunker" transform="translate(355 524)"/><use href="#bunker" transform="translate(500 644)"/><use href="#bunker" transform="translate(645 524)"/>
 <use href="#bunker" transform="translate(313 265)"/><use href="#bunker" transform="translate(687 265)"/>
 <use href="#bunker" transform="translate(313 790)"/><use href="#bunker" transform="translate(687 790)"/>
</g>
<g font-family="sans-serif" font-size="15" fill="#e2e3c8" text-anchor="middle">
 <text x="355" y="491">ДОТ Ц1</text><text x="500" y="687">ДОТ Ц2</text><text x="645" y="491">ДОТ Ц3</text>
 <text x="313" y="224">ДОТ Б1</text><text x="687" y="224">ДОТ Б2</text>
 <text x="313" y="830">ДОТ А1</text><text x="687" y="830">ДОТ А2</text>
</g>
<g><use href="#wreck" transform="translate(415 648) rotate(-22)"/><use href="#wreck" transform="translate(451 688) rotate(15)"/><use href="#wreck" transform="translate(481 727) rotate(-35)"/>
<text x="325" y="634" fill="#e7c8a7" font-family="sans-serif" font-size="16">3 СОЖЖЁННЫХ БТР</text>
<path d="M330 640 L390 650" stroke="#e6d9b9" stroke-width="2"/></g>
<g stroke-dasharray="9 8" stroke-width="4" fill="none" opacity=".65"><path d="M500 818L500 710" stroke="#63b0f9"/><path d="M500 225L500 407" stroke="#f08d77"/><path d="M245 696L365 585" stroke="#63b0f9"/><path d="M760 336L640 453" stroke="#f08d77"/></g>
<g font-family="sans-serif" fill="#eee1c0" font-size="14">
<text x="52" y="974">БАЗЫ: 2</text><text x="222" y="974">ФЕРМЫ: 5</text><text x="390" y="974">ДОТы: 7</text><text x="540" y="974">БТР: 3</text><text x="702" y="974">БОЙ: 12 × 12</text>
<text x="52" y="1008" font-size="16">Удерживай центр, чтобы получать в 5 раз больше золота.</text>
<text x="949" y="1030" text-anchor="end" font-size="12" fill="#acaa9a">Схематичная игровая версия утверждённого чертежа</text>
</g>
</svg>
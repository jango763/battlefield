<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Капрал на линии фронта</title>
<style>html,body{height:100%;margin:0;background:#20251d;color:#f5eedc;font:16px Arial,sans-serif}main{max-width:580px;margin:16vh auto;padding:24px;text-align:center}#progress{font-weight:bold;color:#e1bf7a}button{padding:12px 16px;background:#394335;color:#fff;border:1px solid #a49a76;border-radius:5px}a{color:#e1bf7a}</style></head>
<body><main><h2>Капрал на линии фронта</h2><p>Черепаха · боевой полукруг · восполнение потерь</p><p id="progress">Загрузка игры…</p><p id="error" role="alert"></p><button id="retry" hidden>Повторить загрузку</button><p><a href="../assets/soldiers/CREDITS.md">Авторы моделей</a></p></main>
<script>
(async function(){
  const progress=document.getElementById('progress'),error=document.getElementById('error'),retry=document.getElementById('retry');
  retry.onclick=()=>location.reload();
  async function get(url){
    const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);
    try{const r=await fetch(url,{cache:'force-cache',signal:controller.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.text();}finally{clearTimeout(timer);}
  }
  function once(text,old,value){if(text.split(old).length!==2)throw new Error('Исходная версия изменилась');return text.replace(old,()=>value);}
  try{
    const chunks=new Array(17);let next=0,done=0;
    const worker=async()=>{while(next<17){const i=next++;chunks[i]=await get('parts/german-'+String(i).padStart(3,'0')+'.txt');progress.textContent='Загрузка игры: '+Math.round(++done/18*100)+'%';}};
    const work=await Promise.all([get('german-v5.js?v=20261113-ready-ww2-m43-4'),...Array.from({length:4},worker)]);
    let html=chunks.join('');const start='// === Preview integration: German WW2 Panzergrenadier (red faction) ===',end='// === End of preview integration ===';
    const a=html.indexOf(start),b=html.indexOf(end,a);if(a<0||b<a)throw new Error('Не найдена основа тестовой версии');
    html=html.slice(0,a)+work[0]+html.slice(b+end.length);
    html=once(html,'if(moving)dust(o,dt);if(m.spr)','if(moving)dust(o,dt);if(o.germanPreview){animateGermanSoldier(o,dt);return}if(m.spr)');
    html=once(html,'U=U.filter(u=>{if(u.hp>0)return true;','U=U.filter(u=>{if(u.hp>0)return true;disposeGermanSoldier(u);');
    html=once(html,'dustUpdate(dt);pointsUpdate(dt);fogUpdate(dt);','refreshGermanPreviewLabel();dustUpdate(dt);pointsUpdate(dt);fogUpdate(dt);');
    // Only change escort slots. Never override tactical combat decisions.
    // Only positions change; existing magnet and autonomous battle decisions are preserved.
    // Stable formation slots: retain original magnet, autonomous combat and v5 animations.
    html=once(html,"U.filter(u=>u.guard).forEach((u,k)=>{const sd=k%2?1:-1,row=(k>>1)+1;u.slot={x:P.x-fx*row*2.6-fz*sd*(1.4+row*.9),z:P.z-fz*row*2.6+fx*sd*(1.4+row*.9)}})","const guards=U.filter(u=>u.guard);\n  // Slot ownership is stable. Removed guards free their slots; recruits fill\n  // the vacancy without pushing every surviving soldier to a new position.\n  const occupied=new Set();\n  for(const u of guards){\n    if(!Number.isInteger(u.escortSlot)||u.escortSlot<0||u.escortSlot>5||occupied.has(u.escortSlot))u.escortSlot=-1;\n    else occupied.add(u.escortSlot);\n  }\n  for(const u of guards){\n    if(u.escortSlot>=0)continue;\n    // Center-first recruitment; when all six are present, the approved 3x2\n    // grid has exactly the same coordinates as formation-combat-v2.\n    for(const slot of [1,0,2,4,3,5])if(!occupied.has(slot)){\n      u.escortSlot=slot;\n      occupied.add(slot);\n      break;\n    }\n  }\n  const now=performance.now();\n  let threat=null,nearest=21;\n  for(const foe of foesOf(P)){\n    let d=dst(P,foe);\n    for(const guard of guards)d=Math.min(d,dst(guard,foe)+2);\n    if(d<nearest){nearest=d;threat=foe;}\n  }\n  if(threat){guardUpdate.focus=threat;guardUpdate.battleUntil=now+1900;}\n  const battle=guards.length>0&&(!!threat||(guardUpdate.focus&&now<(guardUpdate.battleUntil||0)));\n  let faceX=fx,faceZ=fz;\n  if(battle){\n    const dx=guardUpdate.focus.x-P.x,dz=guardUpdate.focus.z-P.z,len=Math.hypot(dx,dz);\n    if(len>.3){faceX=dx/len;faceZ=dz/len;}\n    if(!guardUpdate.face)guardUpdate.face={x:faceX,z:faceZ};\n    else{\n      guardUpdate.face.x+=.14*(faceX-guardUpdate.face.x);\n      guardUpdate.face.z+=.14*(faceZ-guardUpdate.face.z);\n      const fl=Math.hypot(guardUpdate.face.x,guardUpdate.face.z);\n      if(fl>.05){guardUpdate.face.x/=fl;guardUpdate.face.z/=fl;}\n    }\n    faceX=guardUpdate.face.x;faceZ=guardUpdate.face.z;\n  }else guardUpdate.face=null;\n  for(const u of guards){\n    if(!u.slot)u.slot={x:P.x,z:P.z};\n    const k=u.escortSlot;\n    if(battle){\n      // All six slots remain fixed even after a casualty; that vacant arc\n      // position is filled by the next recruit instead of shifting the line.\n      const angle=(k/5-.5)*Math.PI*.82;\n      const forward=5.25*Math.cos(angle),side=5.25*Math.sin(angle);\n      u.slot.x=P.x+faceX*forward-faceZ*side;\n      u.slot.z=P.z+faceZ*forward+faceX*side;\n    }else{\n      // The approved turtle layout: three across in each of two rows.\n      const row=Math.floor(k/3),lateral=(k%3-1)*2.45,ahead=3.6+row*2.9;\n      u.slot.x=P.x+fx*ahead-fz*lateral;\n      u.slot.z=P.z+fz*ahead+fx*lateral;\n    }\n  }");
    html=once(html,'<button type="button" id="german-compare">🇩🇪 Сравнить немца</button>','');
    html=once(html,"U.push(u);if(t==='red'&&!cmd&&!eng)attachGermanSoldier(u);return u;","U.push(u);attachGermanSoldier(u);return u;");
    if(html.split('pm.mf.getWorldPosition(mzV);').length!==3)throw new Error('Изменилось крепление прицела');
    html=html.split('pm.mf.getWorldPosition(mzV);').join('(P.germanPreview?P.germanPreview.weapon.flash:pm.mf).getWorldPosition(mzV);');
    html=once(html,'<title>Серый наёмник: линия фронта</title>','<title>Капрал на линии фронта</title>');
    html=once(html,'document.body.prepend(R.domElement);','document.body.prepend(R.domElement);'+"\n// WebGL context recovery: display a non-blocking status while Three.js restores the renderer.\nconst glRecoveryMessage=document.createElement('div');\nglRecoveryMessage.id='webgl-recovery-message';\nglRecoveryMessage.style.cssText='position:fixed;z-index:99999;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);padding:12px 16px;text-align:center;background:rgba(25,29,25,.95);color:#fff;font:14px Arial,sans-serif;border:1px solid #9f946f;border-radius:8px';\nglRecoveryMessage.textContent='Восстанавливаем графику… ';\nglRecoveryMessage.hidden=true;\nconst glReload=document.createElement('button');\nglReload.type='button';glReload.textContent='Перезапустить игру';glReload.hidden=true;\nglReload.style.cssText='margin:8px 0 0;padding:8px 12px';\nglReload.addEventListener('click',()=>location.reload());\nglRecoveryMessage.appendChild(glReload);document.body.appendChild(glRecoveryMessage);\nlet glRecoveryTimer=0;\nR.domElement.addEventListener('webglcontextlost',event=>{\n  event.preventDefault();\n  glRecoveryMessage.hidden=false;glReload.hidden=true;\n  clearTimeout(glRecoveryTimer);\n  glRecoveryTimer=setTimeout(()=>{glReload.hidden=false;},5000);\n});\nR.domElement.addEventListener('webglcontextrestored',()=>{\n  clearTimeout(glRecoveryTimer);glRecoveryMessage.hidden=true;glReload.hidden=true;\n});" );
// Visual pass 1: unify terrain, atmospheric fog and daylight with infantry palette.
    html=once(html,"scene.background=new THREE.Color(0x8a8780);scene.fog=new THREE.Fog(0x938d80,70,175);","scene.background=new THREE.Color(0x85877f);scene.fog=new THREE.Fog(0x82857d,70,175);");
    html=once(html,"scene.add(new THREE.HemisphereLight(0xe6e0cc,0x5a5238,.9));const sun=new THREE.DirectionalLight(0xffd9a0,1);","scene.add(new THREE.HemisphereLight(0xe5e5dc,0x50544b,.95));const sun=new THREE.DirectionalLight(0xf6e5c7,.9);");
    html=once(html,"tex('#54402c',['#46341f','#62503a','#3a2b1c','#6b5a44','#4f5a60'],650,[20,14])","tex('#595c4e',['#4c5346','#6e6854','#41483e','#77725e','#5e625b'],650,[20,14])");
    progress.textContent='Запуск…';document.open();document.write(html);document.close();
  }catch(e){error.textContent='Не удалось загрузить игру: '+(e.name==='AbortError'?'превышено время ожидания':e.message);progress.textContent='Загрузка прервана';retry.hidden=false;}
})();
</script></body></html>

<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Серый наёмник — немецкий солдат (тест)</title>
<style>html,body{height:100%;margin:0;background:#20251d;color:#f5eedc;font:16px Arial,sans-serif}main{max-width:580px;margin:16vh auto;padding:24px;text-align:center}#progress{font-weight:bold;color:#e1bf7a}button{padding:12px 16px}</style></head>
<body><main><h2>Серый наёмник: линия фронта</h2><p>Загрузка тестовой версии с немецким солдатом…</p><p id="progress">0 / 17</p><p id="error"></p></main>
<script>
(async function(){
  const progress=document.getElementById('progress');
  const error=document.getElementById('error');
  const files=Array.from({length:17},(_,i)=>'parts/german-'+String(i).padStart(3,'0')+'.txt');
  try{
    const chunks=[];
    for(let i=0;i<files.length;i++){
      const response=await fetch(files[i],{cache:'force-cache'});
      if(!response.ok)throw new Error('Файл '+files[i]+': HTTP '+response.status);
      chunks.push(await response.text());progress.textContent=(i+1)+' / '+files.length;
    }
    const html=chunks.join('');
    if(!html.includes('<html')||!html.includes('</html>'))throw new Error('Повреждена тестовая сборка');
    document.open();document.write(html);document.close();
  }catch(e){
    error.textContent='Не удалось загрузить тест: '+e.message;
    error.style.color='#ff9a77';
    progress.textContent='Ошибка загрузки';
  }
})();
</script></body></html>

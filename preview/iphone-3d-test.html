<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Проверка 3D на iPhone</title><style>body{margin:0;background:#202825;color:#fff;font:16px system-ui}#status{position:fixed;top:15px;left:15px;right:15px;z-index:2;background:#17221cdd;padding:12px;border-radius:8px}canvas{display:block;touch-action:none}</style></head><body><div id="status">Запуск проверки WebGL…</div><script>const statusEl=document.getElementById('status');function report(t){statusEl.textContent=t}window.addEventListener('error',e=>report('Ошибка: '+e.message));window.addEventListener('unhandledrejection',e=>report('Ошибка загрузки: '+String(e.reason)));</script><script type="module">try{const T=await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');const r=new T.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.setSize(innerWidth,innerHeight);document.body.appendChild(r.domElement);const s=new T.Scene();s.background=new T.Color(0x33463b);const c=new T.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);c.position.set(3,2.8,6);c.lookAt(0,1,0);s.add(new T.HemisphereLight(0xffffff,0x666644,3));const g=new T.Group();s.add(g);const m=(color)=>new T.MeshStandardMaterial({color,flatShading:true});function part(geo,mat,x,y,z,parent=g){const o=new T.Mesh(geo,mat);o.position.set(x,y,z);parent.add(o);return o}const sand=m(0xb7a16e),blue=m(0x287de1),skin=m(0xe4ba93),brown=m(0x65412d),steel=m(0x353b42);part(new T.BoxGeometry(.65,.8,.34),sand,0,1.45,0);part(new T.IcosahedronGeometry(.26,1),skin,0,2.08,0);part(new T.SphereGeometry(.38,10,6),sand,0,2.37,0);part(new T.BoxGeometry(.72,.08,.46),blue,0,2.35,0);for(const x of[-.2,.2]){part(new T.BoxGeometry(.28,.8,.3),sand,x,.7,0);part(new T.BoxGeometry(.28,.3,.36),brown,x,.19,.06)}for(const x of[-.48,.48]){part(new T.BoxGeometry(.24,.56,.24),sand,x,1.55,0);part(new T.BoxGeometry(.25,.13,.26),blue,x,1.62,0);part(new T.BoxGeometry(.17,.4,.18),skin,x,1.08,.17)}const rifle=new T.Group();rifle.rotation.y=Math.PI/2;rifle.position.set(0,1.26,.43);g.add(rifle);part(new T.BoxGeometry(.12,.12,1.65),brown,0,0,0,rifle);part(new T.BoxGeometry(.08,.08,.75),steel,0,.04,.9,rifle);const floor=part(new T.CylinderGeometry(2.4,2.4,.1,32),m(0x53634d),0,-.12,0,s);let dragging=false,last=0; r.domElement.onpointerdown=e=>{dragging=true;last=e.clientX;r.domElement.setPointerCapture(e.pointerId)};r.domElement.onpointermove=e=>{if(dragging){g.rotation.y+=(e.clientX-last)*.01;last=e.clientX}};r.domElement.onpointerup=()=>dragging=false;addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});report('3D работает. Поверни бойца пальцем.');function tick(){requestAnimationFrame(tick);r.render(s,c)}tick()}catch(e){report('3D не запустилось: '+e.message)}</script></body></html>
